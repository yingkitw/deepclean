[package]
name = "deepclean"
version = "0.1.3"
edition = "2024"
description = "Fast, parallel Rust tool to clean Cargo target/ directories, remove unused dependencies, and free disk space from global toolchain caches (npm, Bun, cargo, pip, uv, Homebrew, HuggingFace, and more)"
license = "Apache-2.0"
authors = ["Ying Kit WONG"]
repository = "https://github.com/yingkitw/deepclean.git"
documentation = "https://docs.rs/deepclean"
homepage = "https://github.com/yingkitw/deepclean"
keywords = ["cargo", "clean", "rust", "disk-space", "cache"]
categories = ["command-line-utilities", "development-tools::cargo-plugins", "filesystem"]

[[bin]]
name = "cargo-deepclean"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
glob = "0.3"
walkdir = "2.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"

